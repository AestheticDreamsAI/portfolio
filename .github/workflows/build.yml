name: Build Plugin

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (VST3 fuer FL Studio)
            os: windows-latest
            artifact: Ironcurve-Auto-EQ-Windows-VST3
          - name: macOS (VST3, Universal)
            os: macos-latest
            artifact: Ironcurve-Auto-EQ-macOS-VST3

    steps:
      - uses: actions/checkout@v4

      - name: Konfigurieren
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DIRONCURVE_BUILD_TESTS=ON

      - name: Bauen
        run: cmake --build build --config Release --parallel 4

      - name: Tests des Auto-EQ-Kerns
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Plugin unter Windows laden und pruefen (pluginval)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          unzip -q pv.zip -d pv
          rc=0
          for p in "IroncurveAutoEQ_artefacts/Release/VST3/Ironcurve Auto EQ.vst3" "IroncurveMaster_artefacts/Release/VST3/Ironcurve Master.vst3"; do
            ./pv/pluginval.exe --strictness-level 5 --validate-in-process --timeout-ms 300000 \
              --validate "build/$p" 2>&1 | tee -a pluginval-windows.txt
            [ ${PIPESTATUS[0]} -eq 0 ] || rc=1
          done
          exit $rc

      - name: Plugin einsammeln
        if: always()
        shell: bash
        run: |
          mkdir -p dist
          cp -R "build/IroncurveAutoEQ_artefacts/Release/VST3/Ironcurve Auto EQ.vst3" dist/ || true
          cp -R "build/IroncurveMaster_artefacts/Release/VST3/Ironcurve Master.vst3" dist/ || true
          cp README.md dist/
          cp pluginval-windows.txt dist/ 2>/dev/null || true
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "build/IroncurveAutoEQ_artefacts/Release/Standalone/Ironcurve Auto EQ.exe" "dist/Ironcurve Auto EQ (Standalone).exe" || true
          fi

      - name: Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zippen
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -qr "../${d%/}.zip" .); done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip

  # Fertige Dateien zusaetzlich als Git-Branch ablegen (Download ohne Login-Artefakte)
  dist-branch:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: In Branch ironcurve-dist pushen
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -qr "../${d%/}.zip" .); done
          mkdir ../out && mv *.zip ../out/ && cd ../out
          git init -q -b ironcurve-dist
          git -c user.name=ci -c user.email=ci@example.com add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ironcurve-dist

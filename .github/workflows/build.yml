name: Build Plugin

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (VST3 fuer FL Studio)
            os: windows-latest
            artifact: Ironcurve-Auto-EQ-Windows-VST3
          - name: macOS (VST3, Universal)
            os: macos-latest
            artifact: Ironcurve-Auto-EQ-macOS-VST3

    steps:
      - uses: actions/checkout@v4

      - name: Konfigurieren
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DIRONCURVE_BUILD_TESTS=ON

      - name: Bauen
        run: cmake --build build --config Release --parallel 4

      - name: Tests des Auto-EQ-Kerns
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Plugin einsammeln
        shell: bash
        run: |
          mkdir -p dist
          cp -R "build/IroncurveAutoEQ_artefacts/Release/VST3/Ironcurve Auto EQ.vst3" dist/
          cp README.md dist/

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zippen
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -qr "../${d%/}.zip" .); done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip

  # Fertige Dateien zusaetzlich als Git-Branch ablegen (Download ohne Login-Artefakte)
  dist-branch:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: In Branch ironcurve-dist pushen
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -qr "../${d%/}.zip" .); done
          mkdir ../out && mv *.zip ../out/ && cd ../out
          git init -q -b ironcurve-dist
          git -c user.name=ci -c user.email=ci@example.com add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ironcurve-dist
